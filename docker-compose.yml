services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: taskflow-jenkins:latest
    container_name: taskflow-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/taskflow
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    restart: unless-stopped
    networks:
      - taskflow-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: taskflow-user-service:latest
    container_name: taskflow-user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - taskflow-network
    restart: unless-stopped

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    image: taskflow-task-service:latest
    container_name: taskflow-task-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - USER_SERVICE_URL=http://user-service:3001
    networks:
      - taskflow-network
    depends_on:
      - user-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskflow-frontend:latest
    container_name: taskflow-frontend
    ports:
      - "80:80"
    networks:
      - taskflow-network
    depends_on:
      - user-service
      - task-service
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - taskflow-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - taskflow-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  jenkins_home:
  prometheus_data:
  grafana_data:

networks:
  taskflow-network:
    driver: bridge
