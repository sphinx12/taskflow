server {
    listen 80;
    server_name _;

    # Serve static frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for User Service
    location /api/users {
        proxy_pass http://user-service:3001/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy for Task Service
    location /api/tasks {
        proxy_pass http://task-service:3002/api/tasks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy for Health checks
    location /api/health/user {
        proxy_pass http://user-service:3001/health;
    }

    location /api/health/task {
        proxy_pass http://task-service:3002/health;
    }
}
