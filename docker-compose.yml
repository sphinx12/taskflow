services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: taskflow-user-service:latest
    container_name: taskflow-user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - taskflow-network
    restart: unless-stopped

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    image: taskflow-task-service:latest
    container_name: taskflow-task-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - USER_SERVICE_URL=http://user-service:3001
    networks:
      - taskflow-network
    depends_on:
      - user-service
    restart: unless-stopped

networks:
  taskflow-network:
    driver: bridge
